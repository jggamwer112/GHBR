<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Login</title>
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#171323">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
</head>

<body class="body_login">
    <header class="header_login">
        <h1>💽 GameHub Brasil 2026 💽</h1>
        <h3>Faça login para começar a comprar!!</h3>
    </header>
    <section class="section_login">
        <form class="form" method="post">Preencha as informações:
            <p>Nome:
                <input type="text" id="login_nome" placeholder="Ex: Joana">
            </p>
            <p>Idade:
                <input type="number" id="idade" placeholder="Ex: 18">
            </p>
            <p>Email:
                <input type="email" id="email" placeholder="Ex: joana12@gmail.com">
            </p>
            <button type="submit" id="btn_criar">Criar conta</button>
        </form>
    </section>
</body>
<script src="pwa.js"></script>
<script src="index.js"></script>

</html>
